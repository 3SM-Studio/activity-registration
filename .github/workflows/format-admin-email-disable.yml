name: Format admin email disable patch

on:
  push:
    branches:
      - chore/disable-admin-registration-email

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/disable-admin-registration-email
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/unit/notification-outbox.test.ts tests/unit/registration-notifications.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/notification-outbox.test.ts tests/unit/registration-notifications.test.ts
          git commit -m "chore: format admin email disable patch"
          git push origin HEAD:chore/disable-admin-registration-email
