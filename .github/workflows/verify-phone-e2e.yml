name: Verify phone E2E

on:
  push:
    branches:
      - feat/phone-input
    paths:
      - .github/workflows/verify-phone-e2e.yml

permissions:
  contents: read
  statuses: write

jobs:
  phone-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phone-input
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify hosted Chrome
        run: google-chrome --version
      - name: Create targeted Playwright config
        run: |
          cat > playwright.phone-ci.config.ts <<'EOF'
          import { defineConfig, devices } from "@playwright/test";

          export default defineConfig({
            testDir: "./tests/e2e",
            fullyParallel: false,
            forbidOnly: true,
            retries: 0,
            workers: 1,
            reporter: "line",
            use: {
              baseURL: "http://localhost:3000",
              channel: "chrome",
            },
            webServer: {
              command: "pnpm dev",
              url: "http://localhost:3000",
              reuseExistingServer: false,
              env: {
                APP_ENV: "test",
                DATA_BACKEND: "memory",
              },
            },
            projects: [
              {
                name: "hosted-chrome",
                use: {
                  ...devices["Desktop Chrome"],
                  channel: "chrome",
                },
              },
            ],
          });
          EOF
      - name: Verify phone country selector and formatting
        id: phone_e2e
        continue-on-error: true
        run: >-
          pnpm exec playwright test
          tests/e2e/registration.spec.ts
          --config=playwright.phone-ci.config.ts
          --grep="formats a Polish phone number and exposes the country selector"
      - name: Publish phone E2E status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.phone_e2e.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            STATE=success
            DESCRIPTION="Country selector and live formatting passed"
          else
            STATE=failure
            DESCRIPTION="Phone input E2E failed"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"Phone E2E\",\"description\":\"${DESCRIPTION}\"}"
      - name: Fail when phone E2E failed
        if: steps.phone_e2e.outcome != 'success'
        run: exit 1
