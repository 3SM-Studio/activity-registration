name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - preview

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/birth-date-sheets-table'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/birth-date-sheets-table
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git commit -m "chore: sync pinned date picker lockfile"
          git push origin HEAD:feat/birth-date-sheets-table

  check:
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/birth-date-sheets-table'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Quality gate
        run: pnpm check
      - name: Verify system Chrome
        run: google-chrome --version
      - name: Critical E2E
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_USE_SYSTEM_CHROME: "1"
