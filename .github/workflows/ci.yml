name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - preview

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/sheets-schema-v3-foundation
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and commit source files
        run: |
          pnpm exec prettier --write scripts/sheet-migrate.ts src/infrastructure/google/parsers.ts src/infrastructure/google/sheet-admin.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sheet-migrate.ts src/infrastructure/google/parsers.ts src/infrastructure/google/sheet-admin.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style: format v3 sheet foundation"
            git push origin HEAD:feat/sheets-schema-v3-foundation
          fi
