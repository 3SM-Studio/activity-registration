name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Temporary Prettier diagnostic
        run: |
          pnpm exec prettier --write tests/unit/sheet-admin.test.ts
          git diff -- tests/unit/sheet-admin.test.ts
          exit 1
      - name: Quality gate
        run: pnpm check
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Critical E2E
        run: pnpm test:e2e
