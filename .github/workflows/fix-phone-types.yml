name: Fix phone input types

on:
  push:
    branches:
      - feat/phone-input
    paths:
      - .github/workflows/fix-phone-types.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phone-input
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch strict TypeScript issues
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("src/components/ui/phone-number-input.tsx")
          text = p.read_text()
          text = text.replace('import type { Ref } from "react";\n', '')
          text = text.replace('  inputRef?: Ref<HTMLInputElement>;\n', '')
          text = text.replace('  describedBy?: string;\n', '  describedBy?: string | undefined;\n')
          text = text.replace('  inputRef,\n', '')
          text = text.replace('      ref={inputRef}\n', '')
          p.write_text(text)

          p = Path("src/components/registration/registration-form.tsx")
          text = p.read_text()
          text = text.replace('                    inputRef={field.ref}\n', '')
          p.write_text(text)
          PY
      - run: pnpm format
      - run: rm .github/workflows/fix-phone-types.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align phone input with strict TypeScript"
          git push origin HEAD:feat/phone-input
