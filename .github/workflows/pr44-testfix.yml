name: PR44 Test And Rollout Fix

on:
  push:
    branches:
      - fix/full-senior-audit-2026-08-21

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[test-fix-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/full-senior-audit-2026-08-21
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply audited fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Operator UX: hide technical IDs, but keep submitted time and human-readable city/offering snapshots visible.
          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              '''const TECHNICAL_COLUMN_RANGES = [\n  { startIndex: 0, endIndex: 7 },\n  { startIndex: 10, endIndex: 11 },\n  { startIndex: 17, endIndex: 23 },\n  { startIndex: 27, endIndex: 29 },\n] as const;''',
              '''const TECHNICAL_COLUMN_RANGES = [\n  { startIndex: 0, endIndex: 2 },\n  { startIndex: 3, endIndex: 5 },\n  { startIndex: 17, endIndex: 23 },\n  { startIndex: 27, endIndex: 29 },\n] as const;''',
          )

          # Safe rolling migration: v3 can be read only to render a closed form, v4 is the only open-capable schema.
          replace_once(
              "src/infrastructure/google/settings.repository.ts",
              '''    const systemSchemaVersion = settings.get(SETTING_KEY.systemSchemaVersion);\n    if (systemSchemaVersion !== String(SYSTEM_SCHEMA_VERSION)) {\n      throw new SheetSchemaError(\n        `Unsupported SYSTEM_SCHEMA_VERSION: ${systemSchemaVersion ?? "<missing>"}`,\n      );\n    }''',
              '''    const systemSchemaVersion = settings.get(SETTING_KEY.systemSchemaVersion);\n    const migrationReadVersion = SYSTEM_SCHEMA_VERSION - 1;\n    const schemaVersion = Number(systemSchemaVersion);\n    if (schemaVersion !== SYSTEM_SCHEMA_VERSION && schemaVersion !== migrationReadVersion) {\n      throw new SheetSchemaError(\n        `Unsupported SYSTEM_SCHEMA_VERSION: ${systemSchemaVersion ?? "<missing>"}`,\n      );\n    }\n    const schemaReadyForWrites = schemaVersion === SYSTEM_SCHEMA_VERSION;''',
          )
          replace_once(
              "src/infrastructure/google/settings.repository.ts",
              '''      registrationsOpen: parseBooleanCell(settings.get(SETTING_KEY.registrationsOpen) ?? ""),''',
              '''      registrationsOpen:\n        schemaReadyForWrites &&\n        parseBooleanCell(settings.get(SETTING_KEY.registrationsOpen) ?? ""),''',
          )

          # Settings tests: v4 is canonical, v3 is accepted only fail-closed, v5 is unsupported.
          replace_once(
              "tests/unit/settings-repository.test.ts",
              '''    SYSTEM_SCHEMA_VERSION: "3",''',
              '''    SYSTEM_SCHEMA_VERSION: "4",''',
          )
          replace_once(
              "tests/unit/settings-repository.test.ts",
              '''  it("rejects an unsupported system schema version", async () => {\n    const repository = new GoogleSheetsSettingsRepository(\n      createClient(validSettings({ SYSTEM_SCHEMA_VERSION: "4" })),\n    );\n\n    await expect(repository.getPublicSettings()).rejects.toThrow(\n      /Unsupported SYSTEM_SCHEMA_VERSION/,\n    );\n  });''',
              '''  it("accepts the previous schema only in fail-closed migration mode", async () => {\n    const repository = new GoogleSheetsSettingsRepository(\n      createClient(validSettings({ SYSTEM_SCHEMA_VERSION: "3", REGISTRATIONS_OPEN: "TAK" })),\n    );\n\n    await expect(repository.getPublicSettings()).resolves.toMatchObject({\n      registrationsOpen: false,\n      currentSeasonId: "test-2026-2027",\n    });\n  });\n\n  it("rejects an unsupported system schema version", async () => {\n    const repository = new GoogleSheetsSettingsRepository(\n      createClient(validSettings({ SYSTEM_SCHEMA_VERSION: "5" })),\n    );\n\n    await expect(repository.getPublicSettings()).rejects.toThrow(\n      /Unsupported SYSTEM_SCHEMA_VERSION/,\n    );\n  });''',
          )

          # Operator tests follow v4 layout and preserve business-readable columns.
          replace_once(
              "tests/unit/operator-sheet.test.ts",
              '''            endColumnIndex: 28,''',
              '''            endColumnIndex: 29,''',
          )
          replace_once(
              "tests/unit/operator-sheet.test.ts",
              '''      { sheetId: 1003, dimension: "COLUMNS", startIndex: 0, endIndex: 2 },\n      { sheetId: 1003, dimension: "COLUMNS", startIndex: 3, endIndex: 5 },\n      { sheetId: 1003, dimension: "COLUMNS", startIndex: 17, endIndex: 23 },\n      { sheetId: 1003, dimension: "COLUMNS", startIndex: 26, endIndex: 28 },''',
              '''      { sheetId: 1003, dimension: "COLUMNS", startIndex: 0, endIndex: 2 },\n      { sheetId: 1003, dimension: "COLUMNS", startIndex: 3, endIndex: 5 },\n      { sheetId: 1003, dimension: "COLUMNS", startIndex: 17, endIndex: 23 },\n      { sheetId: 1003, dimension: "COLUMNS", startIndex: 27, endIndex: 29 },''',
          )
          replace_once(
              "tests/unit/operator-sheet.test.ts",
              '''    for (const operatorColumn of [15, 16, 23, 24, 25]) {''',
              '''    for (const operatorColumn of [2, 5, 6, 15, 16, 23, 24, 25, 26]) {''',
          )

          # Admin email tests assert minimization rather than the removed PII copy/reply-to behavior.
          replace_once(
              "tests/unit/registration-notifications.test.ts",
              '''      to: ["biuro@example.com"],\n      replyTo: "anna@example.com",\n      idempotencyKey: "registration-admin/reg_11111111-1111-4111-8111-111111111111",''',
              '''      to: ["biuro@example.com"],\n      idempotencyKey: "registration-admin/reg_11111111-1111-4111-8111-111111111111",''',
          )
          replace_once(
              "tests/unit/registration-notifications.test.ts",
              '''    expect(messages[1]?.text).toContain("Rodzic/opiekun");\n    expect(messages[1]?.text).toContain("Anna Kowalska");\n    expect(messages[1]?.text).toContain("2012-01-15");''',
              '''    expect(messages[1]?.replyTo).toBeUndefined();\n    expect(messages[1]?.text).toContain("Pełne dane kontaktowe");\n    expect(messages[1]?.text).not.toContain("Anna Kowalska");\n    expect(messages[1]?.text).not.toContain("2012-01-15");\n    expect(messages[1]?.text).not.toContain("+48500000000");\n    expect(messages[1]?.text).not.toContain("anna@example.com");\n    expect(messages[1]?.text).not.toContain("Jan Kowalski");''',
          )
          replace_once(
              "tests/unit/registration-notifications.test.ts",
              '''    const sender = new RecordingSender((message) => message.subject.startsWith("Nowe zgłoszenie:"));''',
              '''    const sender = new RecordingSender((message) =>\n      message.idempotencyKey.startsWith("registration-admin/"),\n    );''',
          )

          # Sheet-admin tests reflect the new managed protection model. TEST remains warning-only; PROD supplies SA editors for hard mode.
          path = Path("tests/unit/sheet-admin.test.ts")
          text = path.read_text()
          start = text.index('  it("adds warning protections while operational v3 columns remain editable"')
          end = text.index('  it("creates a native registrations table with typed columns"', start)
          replacement = '''  it("adds warning-only v4 system protections in non-production bootstrap", async () => {\n    const { client, batchRequests } = createBootstrapClient();\n\n    await bootstrapSheetStructure(client);\n\n    const protectedRanges = batchRequests.flatMap((request) => {\n      const addProtectedRange = request.addProtectedRange as\n        { protectedRange?: Record<string, unknown> } | undefined;\n      return addProtectedRange?.protectedRange ? [addProtectedRange.protectedRange] : [];\n    });\n\n    expect(protectedRanges).toEqual(\n      expect.arrayContaining([\n        expect.objectContaining({\n          description: "activity-registration:hard-system:core-identifiers",\n          warningOnly: true,\n          range: expect.objectContaining({ startColumnIndex: 0, endColumnIndex: 7 }),\n        }),\n        expect.objectContaining({\n          description: "activity-registration:hard-system:age-snapshot",\n          warningOnly: true,\n          range: expect.objectContaining({ startColumnIndex: 10, endColumnIndex: 11 }),\n        }),\n        expect.objectContaining({\n          description: "activity-registration:hard-system:submission-metadata",\n          warningOnly: true,\n          range: expect.objectContaining({ startColumnIndex: 17, endColumnIndex: 23 }),\n        }),\n        expect.objectContaining({\n          description: "activity-registration:hard-system:duplicate-and-schema",\n          warningOnly: true,\n          range: expect.objectContaining({ startColumnIndex: 27, endColumnIndex: 29 }),\n        }),\n        expect.objectContaining({\n          description: "activity-registration:hard-system:header",\n          warningOnly: true,\n        }),\n      ]),\n    );\n  });\n\n  it("uses hard protection with only the dedicated production editor when configured", async () => {\n    const { client, batchRequests } = createBootstrapClient();\n\n    await bootstrapSheetStructure(client, {\n      hardProtectionEditorEmails: ["prod-sa@example.iam.gserviceaccount.com"],\n    });\n\n    const protectedRanges = batchRequests.flatMap((request) => {\n      const addProtectedRange = request.addProtectedRange as\n        { protectedRange?: Record<string, unknown> } | undefined;\n      return addProtectedRange?.protectedRange ? [addProtectedRange.protectedRange] : [];\n    });\n\n    expect(protectedRanges).not.toHaveLength(0);\n    for (const protectedRange of protectedRanges) {\n      expect(protectedRange).toMatchObject({\n        warningOnly: false,\n        editors: { users: ["prod-sa@example.iam.gserviceaccount.com"] },\n      });\n    }\n  });\n\n'''
          path.write_text(text[:start] + replacement + text[end:])

          path = Path("tests/unit/sheet-admin.test.ts")
          text = path.read_text()
          start = text.index('  it("replaces stale v2 registration protections without duplicating them"')
          end = text.index('\n  });\n});', start) + len('\n  });')
          replacement = '''  it("deletes legacy managed protections before creating the v4 protection set", async () => {\n    const existing: readonly ProtectedRangeMetadata[] = [\n      {\n        protectedRangeId: 101,\n        description: "activity-registration:system-columns:identity-and-pii",\n        warningOnly: true,\n        startColumnIndex: 0,\n        endColumnIndex: 14,\n      },\n      {\n        protectedRangeId: 102,\n        description: "activity-registration:system-columns:metadata",\n        warningOnly: true,\n        startColumnIndex: 16,\n        endColumnIndex: 21,\n      },\n    ];\n    const { client, batchRequests } = createBootstrapClient(existing);\n\n    await bootstrapSheetStructure(client);\n\n    expect(batchRequests).toEqual(\n      expect.arrayContaining([\n        { deleteProtectedRange: { protectedRangeId: 101 } },\n        { deleteProtectedRange: { protectedRangeId: 102 } },\n        expect.objectContaining({\n          addProtectedRange: expect.objectContaining({\n            protectedRange: expect.objectContaining({\n              description: "activity-registration:hard-system:core-identifiers",\n            }),\n          }),\n        }),\n        expect.objectContaining({\n          addProtectedRange: expect.objectContaining({\n            protectedRange: expect.objectContaining({\n              description: "activity-registration:hard-system:duplicate-and-schema",\n            }),\n          }),\n        }),\n      ]),\n    );\n  });'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - run: pnpm format
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: align tests and safe migration rollout [test-fix-bot]"
          git push origin HEAD:fix/full-senior-audit-2026-08-21
