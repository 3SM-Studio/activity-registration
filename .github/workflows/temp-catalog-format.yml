name: Temporary catalog formatter

on:
  push:
    branches:
      - feat/refresh-pozytywka-catalog-sep-2026-preview

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/refresh-pozytywka-catalog-sep-2026-preview
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target files
        run: >-
          pnpm exec prettier --write
          src/config/pozytywka-offer-2026-2027.ts
          tests/unit/pozytywka-offer-2026-2027.test.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- src/config/pozytywka-offer-2026-2027.ts tests/unit/pozytywka-offer-2026-2027.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/pozytywka-offer-2026-2027.ts tests/unit/pozytywka-offer-2026-2027.test.ts
          git commit -m "chore: format refreshed catalog"
          git push origin HEAD:feat/refresh-pozytywka-catalog-sep-2026-preview
