name: Format outbox once

on:
  push:
    branches:
      - feat/durable-notification-outbox

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/durable-notification-outbox
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Remove one-time workflow and commit formatting
        run: |
          git rm .github/workflows/format-outbox-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format durable notification outbox"
          git push origin HEAD:feat/durable-notification-outbox
