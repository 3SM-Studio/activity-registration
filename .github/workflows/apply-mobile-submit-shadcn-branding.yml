name: Apply mobile submit fix and shadcn foundation

on:
  push:
    branches:
      - fix/mobile-submit-shadcn-branding
    paths:
      - .github/workflows/apply-mobile-submit-shadcn-branding.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mobile-submit-shadcn-branding

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install shadcn foundation
        run: |
          pnpm add -E class-variance-authority@latest lucide-react@latest radix-ui@latest tw-animate-css@latest
          pnpm add -D -E shadcn@latest

      - name: Restore supplied Pozytywka logo
        shell: bash
        run: |
          mkdir -p public
          echo '' | base64 -d > public/pozytywka-logo.webp

      - name: Apply verified source patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply-ui.sh
          bash /tmp/apply-ui.sh

      - run: pnpm format
      - run: pnpm check

      - name: Verify Android Chrome regression
        shell: bash
        run: |
          google-chrome --version
          cat > playwright.mobile-submit.config.ts <<'EOF'
          import { defineConfig } from "@playwright/test";

          export default defineConfig({
            testDir: "./tests/e2e",
            fullyParallel: false,
            forbidOnly: true,
            retries: 0,
            workers: 1,
            reporter: "line",
            use: {
              baseURL: "http://localhost:3000",
              channel: "chrome",
              viewport: { width: 412, height: 915 },
              hasTouch: true,
              isMobile: true,
              deviceScaleFactor: 2.625,
              userAgent:
                "Mozilla/5.0 (Linux; Android 14; SM-S921B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Mobile Safari/537.36",
            },
            webServer: {
              command: "pnpm dev",
              url: "http://localhost:3000",
              reuseExistingServer: false,
              env: { APP_ENV: "test", DATA_BACKEND: "memory" },
            },
          });
          EOF
          pnpm exec playwright test tests/e2e/registration.spec.ts \
            --config=playwright.mobile-submit.config.ts \
            --grep="shows validation summary without focusing an input|handles accidental honeypot autofill without focusing the hidden field"
          rm playwright.mobile-submit.config.ts

      - name: Remove bootstrap workflow
        run: rm .github/workflows/apply-mobile-submit-shadcn-branding.yml

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden mobile submit and add shadcn branding"
          git push origin HEAD:fix/mobile-submit-shadcn-branding
