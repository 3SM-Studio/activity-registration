name: Apply phone country dropdown format

on:
  push:
    branches:
      - fix/phone-country-dropdown-mobile
    paths:
      - .github/workflows/apply-phone-country-dropdown-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/phone-country-dropdown-mobile
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/components/ui/phone-country-select.tsx tests/e2e/mobile-form-overflow.spec.ts
      - name: Remove helper workflow and commit result
        run: |
          rm .github/workflows/apply-phone-country-dropdown-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/phone-country-select.tsx tests/e2e/mobile-form-overflow.spec.ts .github/workflows/apply-phone-country-dropdown-format.yml
          git commit -m "style: format phone country dropdown fix"
          git push origin HEAD:fix/phone-country-dropdown-mobile
