name: PR44 Final Audit Fix

on:
  push:
    branches:
      - fix/full-senior-audit-2026-08-21

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[final-fix-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/full-senior-audit-2026-08-21
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply final audited fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "tests/unit/registration-notifications.test.ts",
              '''    expect(messages[1]?.html).toContain("Obsługa zgłoszenia");''',
              '''    expect(messages[1]?.html).toContain("Nowe zgłoszenie do obsługi");''',
          )

          # Only active groups exposed by PANEL_OPERATORA are valid dropdown choices.
          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              '''          values: [{ userEnteredValue: "GRUPY!A2:A1000" }],''',
              '''          values: [{ userEnteredValue: `${OPERATOR_DASHBOARD_SHEET}!A13:A1000` }],''',
          )
          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              '''          "Wybierz aktywną grupę z zakładki GRUPY. Po przypisaniu sprawdź zgodność wieku i oferty.",''',
              '''          "Wybierz aktywną grupę bieżącego sezonu. Po przypisaniu sprawdź zgodność wieku i oferty.",''',
          )

          # Dashboard contains active groups for CURRENT_SEASON_ID only.
          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              '''  GROUP_HEADERS,\n  OPERATOR_DASHBOARD_SHEET,\n  REGISTRATION_HEADERS,''',
              '''  GROUP_HEADERS,\n  OPERATOR_DASHBOARD_SHEET,\n  REGISTRATION_HEADERS,\n  SETTING_KEY,\n  SETTINGS_HEADERS,''',
          )
          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              '''  const groupRows = await client.getValues(`${SHEET.groups}!A:ZZ`, {\n    valueRenderOption: "UNFORMATTED_VALUE",\n  });\n  const headers = createHeaderMap(groupRows[0] ?? [], GROUP_HEADERS);\n  const groups = groupRows\n    .slice(1)\n    .map((row) => parseGroupRow(row, headers))\n    .filter((group) => group !== null)\n    .filter((group) => group.active)''',
              '''  const [groupRows, settingsRows] = await Promise.all([\n    client.getValues(`${SHEET.groups}!A:ZZ`, { valueRenderOption: "UNFORMATTED_VALUE" }),\n    client.getValues(`${SHEET.settings}!A:ZZ`),\n  ]);\n  const headers = createHeaderMap(groupRows[0] ?? [], GROUP_HEADERS);\n  const settingsHeaders = createHeaderMap(settingsRows[0] ?? [], SETTINGS_HEADERS);\n  const currentSeasonRows = settingsRows\n    .slice(1)\n    .filter((row) => cell(row, settingsHeaders, "KEY") === SETTING_KEY.currentSeasonId);\n  if (currentSeasonRows.length !== 1) {\n    throw new Error("PANEL_OPERATORA requires exactly one CURRENT_SEASON_ID setting.");\n  }\n  const currentSeasonId = cell(currentSeasonRows[0] ?? [], settingsHeaders, "VALUE");\n  if (!currentSeasonId) {\n    throw new Error("PANEL_OPERATORA requires CURRENT_SEASON_ID.");\n  }\n\n  const groups = groupRows\n    .slice(1)\n    .map((row) => parseGroupRow(row, headers))\n    .filter((group) => group !== null)\n    .filter((group) => group.active && group.seasonId === currentSeasonId)''',
          )
          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              '''import { createHeaderMap } from "@/infrastructure/google/header-map";''',
              '''import { cell, createHeaderMap } from "@/infrastructure/google/header-map";''',
          )

          # Reconciliation explicitly catches inactive group assignments.
          replace_once(
              "scripts/reconcile-registrations.ts",
              '''  const invalidAssignedGroupReference: string[] = [];\n  const groupOfferingMismatch: string[] = [];''',
              '''  const invalidAssignedGroupReference: string[] = [];\n  const inactiveAssignedGroup: string[] = [];\n  const groupOfferingMismatch: string[] = [];''',
          )
          replace_once(
              "scripts/reconcile-registrations.ts",
              '''        } else {\n          if (group.offeringId !== registration.offeringId) {''',
              '''        } else {\n          if (!group.active) {\n            inactiveAssignedGroup.push(registration.id);\n          }\n          if (group.offeringId !== registration.offeringId) {''',
          )
          replace_once(
              "scripts/reconcile-registrations.ts",
              '''    invalidAssignedGroupReference,\n    groupOfferingMismatch,''',
              '''    invalidAssignedGroupReference,\n    inactiveAssignedGroup,\n    groupOfferingMismatch,''',
          )

          # Regression test for active-current-season dropdown source.
          path = Path("tests/unit/operator-sheet.test.ts")
          text = path.read_text()
          needle = '''  it("backs operator filter views with the native registration table", () => {'''
          insert = '''  it("uses the active current-season dashboard list as the group dropdown source", () => {\n    const requests = buildOperatorSheetRequests(sheet());\n    const validation = requests.find((request) => "setDataValidation" in request)?.setDataValidation as\n      | { rule?: { condition?: { type?: string; values?: Array<{ userEnteredValue?: string }> } } }\n      | undefined;\n\n    expect(validation?.rule?.condition).toEqual({\n      type: "ONE_OF_RANGE",\n      values: [{ userEnteredValue: "PANEL_OPERATORA!A13:A1000" }],\n    });\n  });\n\n'''
          if text.count(needle) != 1:
              raise SystemExit("operator-sheet.test.ts: filter view insertion point missing")
          path.write_text(text.replace(needle, insert + needle, 1))
          PY
      - run: pnpm format
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: close final operator audit gaps [final-fix-bot]"
          git push origin HEAD:fix/full-senior-audit-2026-08-21
