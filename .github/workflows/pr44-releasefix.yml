name: PR44 Release Safety Fix

on:
  push:
    branches:
      - fix/full-senior-audit-2026-08-21

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[release-fix-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/full-senior-audit-2026-08-21
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply release safety fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Fail closed before touching the registration store during a rolling schema migration.
          request_block = '''  const requestId = asRequestId(input.requestId);\n  const existing = await dependencies.repositories.registrations.findByRequestId(requestId);\n\n  if (existing) {\n    if (!sameLogicalRequest(existing, normalized)) {\n      throw new ApplicationError(\n        APPLICATION_ERROR_CODE.requestIdConflict,\n        "Formularz został zmieniony po wcześniejszej próbie wysłania. Spróbuj ponownie.",\n      );\n    }\n\n    return {\n      registrationId: existing.id,\n      idempotentReplay: true,\n      businessDuplicate: false,\n      registration: existing,\n    };\n  }\n\n'''
          replace_once("src/application/submit-registration.ts", request_block, "")
          insertion = '''  if (!settings.currentSeasonId) {\n    throw new ApplicationError(\n      APPLICATION_ERROR_CODE.systemNotReady,\n      "System zapisów nie ma skonfigurowanego bieżącego sezonu.",\n    );\n  }\n\n'''
          replacement = insertion + request_block
          replace_once("src/application/submit-registration.ts", insertion, replacement)

          # Public form receives the season-start age reference date.
          replace_once(
              "src/application/get-public-form-config.ts",
              '''    return { catalog: EMPTY_CATALOG, settings } as const;''',
              '''    return { catalog: EMPTY_CATALOG, settings, ageReferenceDate: null } as const;''',
          )
          # The same closed return exists for unavailable season.
          p = Path("src/application/get-public-form-config.ts")
          text = p.read_text()
          old = '''    return { catalog: EMPTY_CATALOG, settings } as const;'''
          if text.count(old) != 1:
              raise SystemExit(f"get-public-form-config.ts: expected second closed return once, found {text.count(old)}")
          p.write_text(text.replace(old, '''    return { catalog: EMPTY_CATALOG, settings, ageReferenceDate: null } as const;''', 1))
          replace_once(
              "src/application/get-public-form-config.ts",
              '''  return {\n    catalog,\n    settings,\n  } as const;''',
              '''  return {\n    catalog,\n    settings,\n    ageReferenceDate: season.startDate,\n  } as const;''',
          )

          replace_once(
              "src/app/page.tsx",
              '''  const { catalog, settings } = await getPublicFormConfig(createApplicationRepositories(), {''',
              '''  const { catalog, settings, ageReferenceDate } = await getPublicFormConfig(\n    createApplicationRepositories(),\n    {''',
          )
          replace_once(
              "src/app/page.tsx",
              '''    requirePrivacyConfiguration: env.APP_ENV === "production",\n  });''',
              '''      requirePrivacyConfiguration: env.APP_ENV === "production",\n    },\n  );''',
          )
          replace_once(
              "src/app/page.tsx",
              '''          <RegistrationForm catalog={catalog} settings={settings} />''',
              '''          <RegistrationForm\n            catalog={catalog}\n            settings={settings}\n            ageReferenceDate={ageReferenceDate}\n          />''',
          )

          # Client mirrors the authoritative season-start age rule.
          replace_once(
              "src/components/registration/registration-form.tsx",
              '''import { PUBLIC_INTAKE_STATUS, type PublicCatalog, type PublicOffering } from "@/domain/catalog";''',
              '''import {\n  PUBLIC_INTAKE_STATUS,\n  offeringSupportsAge,\n  type PublicCatalog,\n  type PublicOffering,\n} from "@/domain/catalog";''',
          )
          replace_once(
              "src/components/registration/registration-form.tsx",
              '''import { calculateAgeToday } from "@/lib/birth-date";''',
              '''import { calculateAgeAtDate, calculateAgeToday } from "@/lib/birth-date";''',
          )
          replace_once(
              "src/components/registration/registration-form.tsx",
              '''type RegistrationFormProps = Readonly<{\n  catalog: PublicCatalog;\n  settings: PublicSettings;\n}>;''',
              '''type RegistrationFormProps = Readonly<{\n  catalog: PublicCatalog;\n  settings: PublicSettings;\n  ageReferenceDate: string | null;\n}>;''',
          )
          replace_once(
              "src/components/registration/registration-form.tsx",
              '''function offeringLabel(offering: PublicOffering): string {''',
              '''function offeringLabel(offering: PublicOffering, ageAtSeasonStart: number | null): string {\n  if (ageAtSeasonStart !== null && !offeringSupportsAge(offering, ageAtSeasonStart)) {\n    return `${offering.name} - brak grupy dla wieku uczestnika`;\n  }''',
          )
          replace_once(
              "src/components/registration/registration-form.tsx",
              '''function offeringIsSelectable(offering: PublicOffering): boolean {\n  return (\n    offering.intakeStatus === PUBLIC_INTAKE_STATUS.open ||\n    offering.intakeStatus === PUBLIC_INTAKE_STATUS.waitlistOnly\n  );\n}\n\nexport function RegistrationForm({ catalog, settings }: RegistrationFormProps) {''',
              '''function offeringIsSelectable(\n  offering: PublicOffering,\n  ageAtSeasonStart: number | null,\n): boolean {\n  const intakeAccepts =\n    offering.intakeStatus === PUBLIC_INTAKE_STATUS.open ||\n    offering.intakeStatus === PUBLIC_INTAKE_STATUS.waitlistOnly;\n  return intakeAccepts &&\n    (ageAtSeasonStart === null || offeringSupportsAge(offering, ageAtSeasonStart));\n}\n\nexport function RegistrationForm({\n  catalog,\n  settings,\n  ageReferenceDate,\n}: RegistrationFormProps) {''',
          )
          replace_once(
              "src/components/registration/registration-form.tsx",
              '''  const age = birthDate ? calculateAgeToday(birthDate) : null;\n  const hasKnownAge = typeof age === "number" && age >= 0;''',
              '''  const age = birthDate ? calculateAgeToday(birthDate) : null;\n  const ageAtSeasonStart =\n    birthDate && ageReferenceDate ? calculateAgeAtDate(birthDate, ageReferenceDate) : null;\n  const hasKnownAge = typeof age === "number" && age >= 0;''',
          )
          replace_once(
              "src/components/registration/registration-form.tsx",
              '''                          disabled={!offeringIsSelectable(offering)}\n                        >\n                          {offeringLabel(offering)}''',
              '''                          disabled={!offeringIsSelectable(offering, ageAtSeasonStart)}\n                        >\n                          {offeringLabel(offering, ageAtSeasonStart)}''',
          )
          replace_once(
              "src/components/registration/registration-form.tsx",
              '''                    if (calculateAgeToday(nextBirthDate) >= 18) {\n                      setValue("guardianFirstName", "", { shouldDirty: true });\n                      setValue("guardianLastName", "", { shouldDirty: true });\n                      clearErrors(["guardianFirstName", "guardianLastName"]);\n                    }''',
              '''                    if (calculateAgeToday(nextBirthDate) >= 18) {\n                      setValue("guardianFirstName", "", { shouldDirty: true });\n                      setValue("guardianLastName", "", { shouldDirty: true });\n                      clearErrors(["guardianFirstName", "guardianLastName"]);\n                    }\n\n                    if (selectedOffering && ageReferenceDate) {\n                      const nextSeasonAge = calculateAgeAtDate(nextBirthDate, ageReferenceDate);\n                      if (\n                        nextSeasonAge >= 0 &&\n                        !offeringSupportsAge(selectedOffering, nextSeasonAge)\n                      ) {\n                        setValue("offeringId", "", {\n                          shouldDirty: true,\n                          shouldValidate: false,\n                        });\n                        setError("offeringId", {\n                          type: "validate",\n                          message:\n                            "Dla wieku uczestnika nie ma aktywnej grupy w wybranych zajęciach.",\n                        });\n                      }\n                    }''',
          )
          replace_once(
              "src/components/registration/registration-form.tsx",
              '''                  Data urodzenia pomaga nam dobrać odpowiednią grupę wiekową oraz ustalić, czy\n                  potrzebujemy danych rodzica lub opiekuna.''',
              '''                  Data urodzenia pomaga dobrać grupę według wieku na początek bieżącego sezonu\n                  oraz ustalić, czy potrzebujemy danych rodzica lub opiekuna.''',
          )

          # Migration is resumable: announce schema v4 only after all structural/operator bootstraps succeed.
          replace_once(
              "scripts/sheet-migrate.ts",
              '''import { bootstrapSheetStructure } from "../src/infrastructure/google/sheet-admin";''',
              '''import {\n  bootstrapSheetStructure,\n  validateSheetStructure,\n} from "../src/infrastructure/google/sheet-admin";\nimport {\n  bootstrapOperatorSheetExperience,\n  validateOperatorSheetExperience,\n} from "../src/infrastructure/google/operator-sheet";\nimport {\n  bootstrapSupportingSheetTables,\n  validateSupportingSheetTables,\n} from "../src/infrastructure/google/supporting-sheet-tables";''',
          )
          replace_once(
              "scripts/sheet-migrate.ts",
              '''  await setSystemSchemaVersion(client, 4);\n  console.info("Migrated sheet schema from version 3 to 4.");''',
              '''  console.info("Prepared sheet structure for schema version 4.");''',
          )
          replace_once(
              "scripts/sheet-migrate.ts",
              '''  await bootstrapSheetStructure(\n    client,\n    hardProtectionEditorEmails ? { hardProtectionEditorEmails } : {},\n  );\n  console.info(\n    `Sheet schema is at version ${SYSTEM_SCHEMA_VERSION}. Workflow status migration updated ${migratedStatuses} row(s).`,\n  );''',
              '''  await bootstrapSheetStructure(\n    client,\n    hardProtectionEditorEmails ? { hardProtectionEditorEmails } : {},\n  );\n  await bootstrapSupportingSheetTables(client);\n  await bootstrapOperatorSheetExperience(client);\n\n  await setSystemSchemaVersion(client, SYSTEM_SCHEMA_VERSION);\n  const report = await validateSheetStructure(client);\n  await validateSupportingSheetTables(client);\n  await validateOperatorSheetExperience(client);\n\n  console.info(\n    `Sheet schema is at version ${SYSTEM_SCHEMA_VERSION}. Workflow status migration updated ${migratedStatuses} row(s). Validation warnings: ${report.warnings.length}.`,\n  );''',
          )

          # Closed-state test also guarantees we never read registrations before the gate.
          path = Path("tests/unit/submit-registration.test.ts")
          text = path.read_text()
          needle = '''  it("uses an application error for closed registrations before requiring a season", async () => {'''
          insert = '''  it("does not touch the registration store when registrations are closed", async () => {\n    const repositories = createRepositories(registrations, { registrationsOpen: false });\n    repositories.registrations.findByRequestId = async () => {\n      throw new Error("registration store must not be read while closed");\n    };\n\n    await expect(submitRegistration(baseRequest, { repositories })).rejects.toMatchObject({\n      code: APPLICATION_ERROR_CODE.registrationsClosed,\n    });\n  });\n\n'''
          if text.count(needle) != 1:
              raise SystemExit("submit-registration.test.ts: closed-state insertion point missing")
          path.write_text(text.replace(needle, insert + needle, 1))
          PY
      - run: pnpm format
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: harden release migration and age eligibility UX [release-fix-bot]"
          git push origin HEAD:fix/full-senior-audit-2026-08-21
