name: Operator duplicate count hotfix

on:
  push:
    branches:
      - fix/operator-duplicate-count-2026-08-21

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[duplicate-count-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/operator-duplicate-count-2026-08-21
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply duplicate counter fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/infrastructure/google/operator-sheet.ts")
          text = path.read_text()

          anchor = '''export const CLOSED_WITHOUT_DATE_FORMULA =\n  '=OR(AND($P2="REJECTED";$AA2="");AND($P2="CANCELLED";$AA2=""))';\n'''
          replacement = anchor + '''export const POSSIBLE_DUPLICATE_COUNT_FORMULA =\n  '=SUMPRODUCT(--(LEN(ZAPISY!AB2:AB)>0))';\n'''
          if text.count(anchor) != 1:
              raise SystemExit("operator-sheet.ts: formula anchor mismatch")
          text = text.replace(anchor, replacement, 1)

          old = '''[stringCell("Możliwe duplikaty"), formulaCell('=COUNTIF(ZAPISY!AB2:AB;"<>")')],'''
          new = '''[stringCell("Możliwe duplikaty"), formulaCell(POSSIBLE_DUPLICATE_COUNT_FORMULA)],'''
          if text.count(old) != 1:
              raise SystemExit("operator-sheet.ts: dashboard duplicate formula mismatch")
          path.write_text(text.replace(old, new, 1))

          test = Path("tests/unit/operator-dashboard-formulas.test.ts")
          test.write_text('''import { describe, expect, it } from "vitest";\n\nimport { POSSIBLE_DUPLICATE_COUNT_FORMULA } from "@/infrastructure/google/operator-sheet";\n\ndescribe("operator dashboard formulas", () => {\n  it("ignores zero-length strings when counting possible duplicate references", () => {\n    expect(POSSIBLE_DUPLICATE_COUNT_FORMULA).toBe(\n      '=SUMPRODUCT(--(LEN(ZAPISY!AB2:AB)>0))',\n    );\n    expect(POSSIBLE_DUPLICATE_COUNT_FORMULA).not.toContain("COUNTIF");\n  });\n});\n''')
          PY
      - run: pnpm format
      - run: pnpm test:run tests/unit/operator-dashboard-formulas.test.ts
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/google/operator-sheet.ts tests/unit/operator-dashboard-formulas.test.ts
          git commit -m "fix: ignore empty strings in duplicate count [duplicate-count-bot]"
          git push origin HEAD:fix/operator-duplicate-count-2026-08-21
