name: temp-age-warning

on:
  push:
    branches:
      - fix/operator-sheet-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/operator-sheet-hardening
          fetch-depth: 0

      - name: Apply age warning behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Pattern not found in {path}: {old[:120]!r}")
              text = text.replace(old, new, 1)
              p.write_text(text)

          replace_once(
              "src/domain/registration.ts",
              'export type RegistrationSource = (typeof REGISTRATION_SOURCE)[keyof typeof REGISTRATION_SOURCE];\n',
              'export type RegistrationSource = (typeof REGISTRATION_SOURCE)[keyof typeof REGISTRATION_SOURCE];\n\nexport const AGE_REVIEW_NOTE_MARKER = "Wiek poza standardowym zakresem grupy" as const;\nexport const AGE_REVIEW_NOTE =\n  `⚠ ${AGE_REVIEW_NOTE_MARKER}. Zweryfikuj ręcznie przed potwierdzeniem.` as const;\n',
          )

          replace_once(
              "src/application/submit-registration.ts",
              'import {\n  REGISTRATION_SCHEMA_VERSION,\n',
              'import {\n  AGE_REVIEW_NOTE,\n  REGISTRATION_SCHEMA_VERSION,\n',
          )
          replace_once(
              "src/application/submit-registration.ts",
              '  const hasEligibleGroup = groups.some((group) => groupSupportsAge(group, eligibilityAge));\n\n  if (!hasEligibleGroup) {\n    const message = "Dla wieku uczestnika nie ma obecnie aktywnej grupy w wybranych zajęciach.";\n    throw new ApplicationError(APPLICATION_ERROR_CODE.participantAgeNotEligible, message, {\n      fieldErrors: {\n        birthDate: [message],\n        offeringId: ["Wybierz zajęcia dostępne dla wieku uczestnika."],\n      },\n    });\n  }\n',
              '  const ageReviewRequired = !groups.some((group) => groupSupportsAge(group, eligibilityAge));\n',
          )
          replace_once(
              "src/application/submit-registration.ts",
              '    notes: "",\n',
              '    notes: ageReviewRequired ? AGE_REVIEW_NOTE : "",\n',
          )

          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              'import { REGISTRATION_STATUS } from "@/domain/registration";\n',
              'import { AGE_REVIEW_NOTE_MARKER, REGISTRATION_STATUS } from "@/domain/registration";\n',
          )
          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              'const STATUS_COLUMN_INDEX = REGISTRATION_HEADERS.indexOf("STATUS");\n',
              'const STATUS_COLUMN_INDEX = REGISTRATION_HEADERS.indexOf("STATUS");\nconst NOTES_COLUMN_INDEX = REGISTRATION_HEADERS.indexOf("NOTES");\n',
          )
          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              '    STATUS_COLUMN_INDEX,\n    GROUP_COLUMN_INDEX,\n',
              '    STATUS_COLUMN_INDEX,\n    NOTES_COLUMN_INDEX,\n    GROUP_COLUMN_INDEX,\n',
          )
          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              'export const POSSIBLE_DUPLICATE_COUNT_FORMULA = "=SUMPRODUCT(--(LEN(ZAPISY!AB2:AB)>0))";\n',
              'export const POSSIBLE_DUPLICATE_COUNT_FORMULA = "=SUMPRODUCT(--(LEN(ZAPISY!AB2:AB)>0))";\nexport const AGE_REVIEW_FORMULA =\n  `=ISNUMBER(SEARCH("${AGE_REVIEW_NOTE_MARKER}";$Q2))`;\n',
          )
          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              '    `+COUNTIFS(ZAPISY!V2:V;"${seasonId}";ZAPISY!P2:P;"CANCELLED";ZAPISY!AA2:AA;"")`\n',
              '    `+COUNTIFS(ZAPISY!V2:V;"${seasonId}";ZAPISY!P2:P;"CANCELLED";ZAPISY!AA2:AA;"")` +\n    `+COUNTIFS(ZAPISY!V2:V;"${seasonId}";ZAPISY!Q2:Q;"*${formulaText(AGE_REVIEW_NOTE_MARKER)}*")`\n',
          )
          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              '  POSSIBLE_DUPLICATE_FORMULA,\n  CONFIRMED_WITHOUT_GROUP_FORMULA,\n',
              '  POSSIBLE_DUPLICATE_FORMULA,\n  AGE_REVIEW_FORMULA,\n  CONFIRMED_WITHOUT_GROUP_FORMULA,\n',
          )
          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              '      "Tylko neutralne informacje organizacyjne. Nie wpisuj danych zdrowotnych, diagnoz, leków, niepełnosprawności, religii, konfliktów rodzinnych ani innych danych wrażliwych.",\n',
              '      "System może dodać ostrzeżenie o wieku poza standardowym zakresem grupy. Po ręcznej weryfikacji możesz je usunąć lub uzupełnić neutralną notatką organizacyjną. Nie wpisuj danych zdrowotnych, diagnoz, leków, niepełnosprawności, religii, konfliktów rodzinnych ani innych danych wrażliwych.",\n',
          )
          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              '    warningConditionalFormat(\n      sheet.sheetId,\n      CONFIRMED_WITHOUT_GROUP_FORMULA,\n',
              '    warningConditionalFormat(\n      sheet.sheetId,\n      AGE_REVIEW_FORMULA,\n      NOTES_COLUMN_INDEX,\n      NOTES_COLUMN_INDEX + 1,\n      warningColor,\n    ),\n    warningConditionalFormat(\n      sheet.sheetId,\n      CONFIRMED_WITHOUT_GROUP_FORMULA,\n',
          )

          replace_once(
              "tests/unit/submit-registration.test.ts",
              'import { REGISTRATION_STATUS, type Registration, type RequestId } from "@/domain/registration";\n',
              'import {\n  AGE_REVIEW_NOTE,\n  REGISTRATION_STATUS,\n  type Registration,\n  type RequestId,\n} from "@/domain/registration";\n',
          )
          old_test = '''  it("uses the season start date for group age eligibility", async () => {\n    const youthGroup: InternalGroup = {\n      ...defaultGroup,\n      ageMin: 13,\n      ageMax: 18,\n    };\n    const catalog = new FakeCatalogRepository(publicCatalog, [youthGroup]);\n\n    await expect(\n      submitRegistration(baseRequest, {\n        repositories: createRepositories(registrations, {}, catalog),\n        now: () => new Date("2026-08-18T12:00:00.000Z"),\n      }),\n    ).rejects.toMatchObject({\n      code: APPLICATION_ERROR_CODE.participantAgeNotEligible,\n    });\n    expect(registrations.records).toHaveLength(0);\n  });\n'''
          new_test = '''  it("accepts an age outside the standard group range and flags it for operator review", async () => {\n    const youthGroup: InternalGroup = {\n      ...defaultGroup,\n      ageMin: 13,\n      ageMax: 18,\n    };\n    const catalog = new FakeCatalogRepository(publicCatalog, [youthGroup]);\n\n    const result = await submitRegistration(baseRequest, {\n      repositories: createRepositories(registrations, {}, catalog),\n      now: () => new Date("2026-08-18T12:00:00.000Z"),\n    });\n\n    expect(result.businessDuplicate).toBe(false);\n    expect(result.registration.status).toBe(REGISTRATION_STATUS.new);\n    expect(result.registration.notes).toBe(AGE_REVIEW_NOTE);\n    expect(registrations.records).toHaveLength(1);\n  });\n'''
          replace_once("tests/unit/submit-registration.test.ts", old_test, new_test)

          replace_once(
              "tests/unit/operator-dashboard-formulas.test.ts",
              'import {\n  POSSIBLE_DUPLICATE_COUNT_FORMULA,\n',
              'import {\n  AGE_REVIEW_FORMULA,\n  POSSIBLE_DUPLICATE_COUNT_FORMULA,\n',
          )
          replace_once(
              "tests/unit/operator-dashboard-formulas.test.ts",
              '    expect(buildAttentionFormula("2026-2027")).toContain(\'ZAPISY!V2:V;"2026-2027"\');\n',
              '    expect(buildAttentionFormula("2026-2027")).toContain(\'ZAPISY!V2:V;"2026-2027"\');\n    expect(buildAttentionFormula("2026-2027")).toContain("ZAPISY!Q2:Q");\n    expect(AGE_REVIEW_FORMULA).toContain("Wiek poza standardowym zakresem grupy");\n',
          )
          PY

      - name: Remove helper workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-age-warning.yml
          git add src/domain/registration.ts src/application/submit-registration.ts src/infrastructure/google/operator-sheet.ts tests/unit/submit-registration.test.ts tests/unit/operator-dashboard-formulas.test.ts
          git commit -m "fix: treat age mismatch as operator warning"
          git push origin HEAD:fix/operator-sheet-hardening
