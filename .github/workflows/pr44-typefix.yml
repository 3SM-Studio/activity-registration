name: PR44 Strict Type Fix

on:
  push:
    branches:
      - fix/full-senior-audit-2026-08-21

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[type-fix-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/full-senior-audit-2026-08-21
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply strict fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "scripts/reconcile-registrations.ts",
              '''    if (\n      [REGISTRATION_STATUS.contacted, REGISTRATION_STATUS.confirmed].includes(\n        registration.status,\n      ) &&\n      !registration.contactedAt\n    ) {''',
              '''    if (\n      (registration.status === REGISTRATION_STATUS.contacted ||\n        registration.status === REGISTRATION_STATUS.confirmed) &&\n      !registration.contactedAt\n    ) {''',
          )

          replace_once(
              "scripts/retention-report.ts",
              '''    const retentionStatus = [\n      REGISTRATION_STATUS.rejected,\n      REGISTRATION_STATUS.cancelled,\n      REGISTRATION_STATUS.waitlisted,\n      REGISTRATION_STATUS.confirmed,\n    ].includes(registration.status);''',
              '''    const retentionStatus =\n      registration.status === REGISTRATION_STATUS.rejected ||\n      registration.status === REGISTRATION_STATUS.cancelled ||\n      registration.status === REGISTRATION_STATUS.waitlisted ||\n      registration.status === REGISTRATION_STATUS.confirmed;''',
          )

          replace_once(
              "scripts/sheet-bootstrap.ts",
              '''  await bootstrapSheetStructure(client, { hardProtectionEditorEmails });''',
              '''  await bootstrapSheetStructure(\n    client,\n    hardProtectionEditorEmails ? { hardProtectionEditorEmails } : {},\n  );''',
          )

          replace_once(
              "scripts/sheet-migrate.ts",
              '''  await bootstrapSheetStructure(client, { hardProtectionEditorEmails });''',
              '''  await bootstrapSheetStructure(\n    client,\n    hardProtectionEditorEmails ? { hardProtectionEditorEmails } : {},\n  );''',
          )

          old_integration = '''  const nowDate = new Date();\n  const [catalog, settings] = await Promise.all([\n    catalogRepository.getPublicCatalog(dateOnlyInPoland(nowDate)),\n    settingsRepository.getPublicSettings(),\n  ]);\n  const offering = catalog.offerings.find(\n    (candidate) => candidate.intakeStatus === "OPEN" || candidate.intakeStatus === "WAITLIST_ONLY",\n  );\n\n  if (!offering) {\n    throw new Error(\n      "TEST catalog has no offering accepting registrations for the integration test.",\n    );\n  }\n\n  const city = catalog.cities.find((candidate) => candidate.id === offering.cityId);\n  if (!city) {\n    throw new Error("TEST catalog offering references a city that is not public.");\n  }\n\n  if (!settings.currentSeasonId) {\n    throw new Error("TEST settings have no CURRENT_SEASON_ID for the integration test.");\n  }\n\n  const season = await catalogRepository.findSeasonById(settings.currentSeasonId);\n  if (!season || !season.active) {\n    throw new Error("TEST CURRENT_SEASON_ID does not resolve to an active season.");\n  }'''
          new_integration = '''  const nowDate = new Date();\n  const settings = await settingsRepository.getPublicSettings();\n  if (!settings.currentSeasonId) {\n    throw new Error("TEST settings have no CURRENT_SEASON_ID for the integration test.");\n  }\n\n  const [catalog, season] = await Promise.all([\n    catalogRepository.getPublicCatalog(dateOnlyInPoland(nowDate), settings.currentSeasonId),\n    catalogRepository.findSeasonById(settings.currentSeasonId),\n  ]);\n  if (!season || !season.active) {\n    throw new Error("TEST CURRENT_SEASON_ID does not resolve to an active season.");\n  }\n\n  const offering = catalog.offerings.find(\n    (candidate) => candidate.intakeStatus === "OPEN" || candidate.intakeStatus === "WAITLIST_ONLY",\n  );\n\n  if (!offering) {\n    throw new Error(\n      "TEST catalog has no offering accepting registrations for the integration test.",\n    );\n  }\n\n  const city = catalog.cities.find((candidate) => candidate.id === offering.cityId);\n  if (!city) {\n    throw new Error("TEST catalog offering references a city that is not public.");\n  }'''
          replace_once("scripts/test-sheets-integration.ts", old_integration, new_integration)

          replace_once(
              "scripts/test-sheets-integration.ts",
              '''    confirmedAt: null,\n    possibleDuplicateOf: null,''',
              '''    confirmedAt: null,\n    closedAt: null,\n    possibleDuplicateOf: null,''',
          )

          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              '''function buildOperatorSheetRequests(sheet: SheetMetadata): readonly Record<string, unknown>[] {''',
              '''export function buildOperatorSheetRequests(\n  sheet: SheetMetadata,\n): readonly Record<string, unknown>[] {''',
          )

          replace_once(
              "tests/unit/registration-duplicates.test.ts",
              '''    confirmedAt: null,\n    possibleDuplicateOf: null,''',
              '''    confirmedAt: null,\n    closedAt: null,\n    possibleDuplicateOf: null,''',
          )

          replace_once(
              "tests/unit/registration-notifications.test.ts",
              '''    confirmedAt: null,\n    possibleDuplicateOf: null,''',
              '''    confirmedAt: null,\n    closedAt: null,\n    possibleDuplicateOf: null,''',
          )

          replace_once(
              "src/infrastructure/google/auth.ts",
              '''export function toGoogleAuthenticationError(_error: unknown): GoogleAuthenticationError {\n  return new GoogleAuthenticationError();\n}''',
              '''export function toGoogleAuthenticationError(error: unknown): GoogleAuthenticationError {\n  void error;\n  return new GoogleAuthenticationError();\n}''',
          )
          PY
      - run: pnpm format
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: satisfy strict audit contracts [type-fix-bot]"
          git push origin HEAD:fix/full-senior-audit-2026-08-21
