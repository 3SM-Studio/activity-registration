name: Format mobile overflow test

on:
  push:
    branches:
      - fix/mobile-form-overflow

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mobile-form-overflow
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/e2e/mobile-form-overflow.spec.ts
      - name: Commit formatted test and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-mobile-overflow.yml
          git add tests/e2e/mobile-form-overflow.spec.ts
          git commit -m "style: apply repository prettier to mobile overflow test"
          git push origin HEAD:fix/mobile-form-overflow
