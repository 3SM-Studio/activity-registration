name: Apply operator sheet hardening patch

on:
  push:
    branches:
      - fix/operator-sheet-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/operator-sheet-hardening
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch operator dashboard generator
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/infrastructure/google/operator-sheet.ts")
          text = path.read_text()

          def sub_once(pattern: str, replacement: str, source: str) -> str:
              result, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected one replacement for: {pattern[:80]!r}, got {count}")
              return result

          text = sub_once(
              r'export function buildFreePlacesSummaryFormula\(firstGroupRow: number, lastGroupRow: number\): string \{.*?\n\}\n\nexport const OPERATOR_DASHBOARD_LAYOUT = \{.*?\n\} as const;',
              '''function formulaText(value: string): string {
            return value.replace(/"/g, '""');
          }

          function statusCountExpression(currentSeasonId: string, status: string): string {
            return `COUNTIFS(ZAPISY!V2:V;"${formulaText(currentSeasonId)}";ZAPISY!P2:P;"${formulaText(status)}")`;
          }

          export function buildStatusCountFormula(currentSeasonId: string, status: string): string {
            return `=${statusCountExpression(currentSeasonId, status)}`;
          }

          export function buildPossibleDuplicateCountFormula(currentSeasonId: string): string {
            return `=SUMPRODUCT(--(ZAPISY!V2:V="${formulaText(currentSeasonId)}");--(LEN(ZAPISY!AB2:AB)>0))`;
          }

          export function buildAttentionFormula(currentSeasonId: string): string {
            const seasonId = formulaText(currentSeasonId);
            return (
              buildPossibleDuplicateCountFormula(currentSeasonId) +
              `+COUNTIFS(ZAPISY!V2:V;"${seasonId}";ZAPISY!P2:P;"CONFIRMED";ZAPISY!X2:X;"")` +
              `+COUNTIFS(ZAPISY!V2:V;"${seasonId}";ZAPISY!P2:P;"CONTACTED";ZAPISY!Y2:Y;"")` +
              `+COUNTIFS(ZAPISY!V2:V;"${seasonId}";ZAPISY!P2:P;"CONFIRMED";ZAPISY!Z2:Z;"")` +
              `+COUNTIFS(ZAPISY!V2:V;"${seasonId}";ZAPISY!P2:P;"REJECTED";ZAPISY!AA2:AA;"")` +
              `+COUNTIFS(ZAPISY!V2:V;"${seasonId}";ZAPISY!P2:P;"CANCELLED";ZAPISY!AA2:AA;"")`
            );
          }

          export function buildFreePlacesSummaryFormula(firstGroupRow: number): string {
            return `=IF(COUNTA(A${firstGroupRow}:A)=0;"BRAK DANYCH";IF(COUNTIFS(A${firstGroupRow}:A;"<>";F${firstGroupRow}:F;"-")+COUNTIFS(A${firstGroupRow}:A;"<>";F${firstGroupRow}:F;"")>0;"BRAK DANYCH";SUMIF(A${firstGroupRow}:A;"<>";H${firstGroupRow}:H)))`;
          }

          export function buildAgeLabel(ageMin: number | null, ageMax: number | null): string {
            if (ageMin === null && ageMax === null) return "bez limitu";
            if (ageMin !== null && ageMax === null) return `${ageMin}+`;
            if (ageMin === null && ageMax !== null) return `do ${ageMax}`;
            return `${ageMin}-${ageMax}`;
          }

          export function buildConfirmedGroupCountFormula(
            currentSeasonId: string,
            dashboardRow: number,
          ): string {
            return `=COUNTIFS(ZAPISY!V$2:V;"${formulaText(currentSeasonId)}";ZAPISY!X$2:X;$A${dashboardRow};ZAPISY!P$2:P;"CONFIRMED")`;
          }

          export const OPERATOR_DASHBOARD_LAYOUT = {
            hiddenGroupIdColumnIndex: 0,
            visibleStartColumnIndex: 1,
            groupHeaderRow: 11,
            groupStartRow: 12,
            dataEndRow: 1000,
          } as const;''',
              text,
          )

          text = sub_once(
              r'  const firstGroupRow = OPERATOR_DASHBOARD_LAYOUT\.groupStartRow;\n  const lastGroupRow = firstGroupRow \+ groups\.length - 1;\n  const freePlacesFormula = buildFreePlacesSummaryFormula\(firstGroupRow, lastGroupRow\);\n  const attentionFormula =.*?;\n\n  const summaryRows = \[',
              '''  const firstGroupRow = OPERATOR_DASHBOARD_LAYOUT.groupStartRow;
            const freePlacesFormula = buildFreePlacesSummaryFormula(firstGroupRow);
            const attentionFormula = buildAttentionFormula(currentSeasonId);
            const statusCount = (status: string) => statusCountExpression(currentSeasonId, status);

            const summaryRows = [''',
              text,
          )

          replacements = {
              '''formulaCell('=COUNTIF(ZAPISY!P2:P;"NEW")')''': '''formulaCell(buildStatusCountFormula(currentSeasonId, "NEW"))''',
              '''formulaCell('=COUNTIF(ZAPISY!P2:P;"IN_REVIEW")+COUNTIF(ZAPISY!P2:P;"CONTACTED")')''': '''formulaCell(`=${statusCount("IN_REVIEW")}+${statusCount("CONTACTED")}`)''',
              '''formulaCell('=COUNTIF(ZAPISY!P2:P;"WAITLISTED")')''': '''formulaCell(buildStatusCountFormula(currentSeasonId, "WAITLISTED"))''',
              '''formulaCell('=COUNTIF(ZAPISY!P2:P;"CONFIRMED")')''': '''formulaCell(buildStatusCountFormula(currentSeasonId, "CONFIRMED"))''',
              '''formulaCell('=COUNTIF(ZAPISY!P2:P;"REJECTED")+COUNTIF(ZAPISY!P2:P;"CANCELLED")')''': '''formulaCell(`=${statusCount("REJECTED")}+${statusCount("CANCELLED")}`)''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one occurrence of {old!r}, got {text.count(old)}")
              text = text.replace(old, new)

          old_active = '''formulaCell(
                '=COUNTIF(ZAPISY!P2:P;"NEW")+COUNTIF(ZAPISY!P2:P;"IN_REVIEW")+' +
                  'COUNTIF(ZAPISY!P2:P;"CONTACTED")+COUNTIF(ZAPISY!P2:P;"WAITLISTED")+' +
                  'COUNTIF(ZAPISY!P2:P;"CONFIRMED")',
              )'''
          new_active = '''formulaCell(
                `=${statusCount("NEW")}+${statusCount("IN_REVIEW")}+${statusCount("CONTACTED")}+` +
                  `${statusCount("WAITLISTED")}+${statusCount("CONFIRMED")}`,
              )'''
          if text.count(old_active) != 1:
              raise SystemExit("Could not replace active registration formula")
          text = text.replace(old_active, new_active)

          text = sub_once(
              r'    const ageLabel =\n      group\.ageMin === null && group\.ageMax === null\n        \? "bez limitu"\n        : `\$\{group\.ageMin \?\? "…"\}-\$\{group\.ageMax \?\? "…"\}`;',
              '    const ageLabel = buildAgeLabel(group.ageMin, group.ageMax);',
              text,
          )

          old_confirmed = '''const confirmedCell = formulaCell(
                `=COUNTIFS(ZAPISY!X2:X;$A${rowNumber};ZAPISY!P2:P;"CONFIRMED")`,
              );'''
          new_confirmed = '''const confirmedCell = formulaCell(
                buildConfirmedGroupCountFormula(currentSeasonId, rowNumber),
              );'''
          if text.count(old_confirmed) != 1:
              raise SystemExit("Could not replace confirmed group count formula")
          text = text.replace(old_confirmed, new_confirmed)

          text = text.replace(
              '          endRowIndex: 1000,\n',
              '          endRowIndex: OPERATOR_DASHBOARD_LAYOUT.dataEndRow,\n',
              1,
          )

          text = sub_once(
              r'''    \{
      repeatCell: \{
        range: \{
          sheetId: dashboard\.sheetId,
          startRowIndex: 11,
          endRowIndex: Math\.max\(11 \+ groups\.length, 12\),
          startColumnIndex: 1,
          endColumnIndex: 9,
        \},
        cell: \{ userEnteredFormat: \{ verticalAlignment: "MIDDLE", wrapStrategy: "WRAP" \} \},
        fields: "userEnteredFormat\.verticalAlignment,userEnteredFormat\.wrapStrategy",
      \},
    \},''',
              '''    {
              repeatCell: {
                range: {
                  sheetId: dashboard.sheetId,
                  startRowIndex: firstGroupRow - 1,
                  endRowIndex: OPERATOR_DASHBOARD_LAYOUT.dataEndRow,
                  startColumnIndex: 1,
                  endColumnIndex: 3,
                },
                cell: {
                  userEnteredFormat: {
                    horizontalAlignment: "LEFT",
                    verticalAlignment: "MIDDLE",
                    wrapStrategy: "WRAP",
                  },
                },
                fields:
                  "userEnteredFormat.horizontalAlignment,userEnteredFormat.verticalAlignment,userEnteredFormat.wrapStrategy",
              },
            },
            {
              repeatCell: {
                range: {
                  sheetId: dashboard.sheetId,
                  startRowIndex: firstGroupRow - 1,
                  endRowIndex: OPERATOR_DASHBOARD_LAYOUT.dataEndRow,
                  startColumnIndex: 3,
                  endColumnIndex: 9,
                },
                cell: {
                  userEnteredFormat: {
                    horizontalAlignment: "CENTER",
                    verticalAlignment: "MIDDLE",
                    wrapStrategy: "WRAP",
                  },
                },
                fields:
                  "userEnteredFormat.horizontalAlignment,userEnteredFormat.verticalAlignment,userEnteredFormat.wrapStrategy",
              },
            },
            {
              repeatCell: {
                range: {
                  sheetId: dashboard.sheetId,
                  startRowIndex: firstGroupRow - 1,
                  endRowIndex: OPERATOR_DASHBOARD_LAYOUT.dataEndRow,
                  startColumnIndex: 3,
                  endColumnIndex: 4,
                },
                cell: { userEnteredFormat: { numberFormat: { type: "TEXT", pattern: "@" } } },
                fields: "userEnteredFormat.numberFormat",
              },
            },
            {
              repeatCell: {
                range: {
                  sheetId: dashboard.sheetId,
                  startRowIndex: firstGroupRow - 1,
                  endRowIndex: OPERATOR_DASHBOARD_LAYOUT.dataEndRow,
                  startColumnIndex: 8,
                  endColumnIndex: 9,
                },
                cell: { userEnteredFormat: { numberFormat: { type: "PERCENT", pattern: "0%" } } },
                fields: "userEnteredFormat.numberFormat",
              },
            },''',
              text,
          )

          text = sub_once(
              r'''\n  if \(groups\.length > 0\) \{.*?\n  \}\n\n  await client\.batchUpdate\(requests\);''',
              '''
            requests.push(
              {
                repeatCell: {
                  range: {
                    sheetId: dashboard.sheetId,
                    startRowIndex: 7,
                    endRowIndex: 8,
                    startColumnIndex: 7,
                    endColumnIndex: 9,
                  },
                  cell: {
                    userEnteredFormat: {
                      textFormat: { fontSize: 13, bold: true },
                      wrapStrategy: "CLIP",
                    },
                  },
                  fields: "userEnteredFormat.textFormat,userEnteredFormat.wrapStrategy",
                },
              },
              {
                updateDimensionProperties: {
                  range: {
                    sheetId: dashboard.sheetId,
                    dimension: "ROWS",
                    startIndex: 7,
                    endIndex: 8,
                  },
                  properties: { pixelSize: 42 },
                  fields: "pixelSize",
                },
              },
              {
                addConditionalFormatRule: {
                  index: 0,
                  rule: {
                    ranges: [
                      {
                        sheetId: dashboard.sheetId,
                        startRowIndex: firstGroupRow - 1,
                        endRowIndex: OPERATOR_DASHBOARD_LAYOUT.dataEndRow,
                        startColumnIndex: 7,
                        endColumnIndex: 8,
                      },
                    ],
                    booleanRule: {
                      condition: {
                        type: "CUSTOM_FORMULA",
                        values: [
                          {
                            userEnteredValue: `=AND($A${firstGroupRow}<>"";$F${firstGroupRow}<>"";$F${firstGroupRow}<>"-";$H${firstGroupRow}=0)`,
                          },
                        ],
                      },
                      format: {
                        backgroundColorStyle: { rgbColor: { red: 0.992, green: 0.91, blue: 0.91 } },
                        textFormat: { bold: true },
                      },
                    },
                  },
                },
              },
              {
                addConditionalFormatRule: {
                  index: 1,
                  rule: {
                    ranges: [
                      {
                        sheetId: dashboard.sheetId,
                        startRowIndex: firstGroupRow - 1,
                        endRowIndex: OPERATOR_DASHBOARD_LAYOUT.dataEndRow,
                        startColumnIndex: 8,
                        endColumnIndex: 9,
                      },
                    ],
                    booleanRule: {
                      condition: {
                        type: "CUSTOM_FORMULA",
                        values: [
                          {
                            userEnteredValue: `=AND($A${firstGroupRow}<>"";ISNUMBER($I${firstGroupRow});$I${firstGroupRow}>=90%)`,
                          },
                        ],
                      },
                      format: {
                        backgroundColorStyle: { rgbColor: { red: 1, green: 0.957, blue: 0.839 } },
                        textFormat: { bold: true },
                      },
                    },
                  },
                },
              },
            );

            await client.batchUpdate(requests);''',
              text,
          )

          old_read = '''async function readDashboardGroupIds(client: SheetsClient): Promise<readonly string[]> {
            const rows = await client.getValues(`${OPERATOR_DASHBOARD_SHEET}!A12:A1000`);'''
          new_read = '''async function readDashboardGroupIds(client: SheetsClient): Promise<readonly string[]> {
            const rows = await client.getValues(
              `${OPERATOR_DASHBOARD_SHEET}!A${OPERATOR_DASHBOARD_LAYOUT.groupStartRow}:A${OPERATOR_DASHBOARD_LAYOUT.dataEndRow}`,
            );'''
          if text.count(old_read) != 1:
              raise SystemExit("Could not harden dashboard group ID read range")
          text = text.replace(old_read, new_read)

          path.write_text(text)

          Path("tests/unit/operator-dashboard-formulas.test.ts").write_text(r'''import { describe, expect, it } from "vitest";

          import {
            POSSIBLE_DUPLICATE_COUNT_FORMULA,
            buildAgeLabel,
            buildAttentionFormula,
            buildConfirmedGroupCountFormula,
            buildFreePlacesSummaryFormula,
            buildPossibleDuplicateCountFormula,
            buildStatusCountFormula,
          } from "@/infrastructure/google/operator-sheet";

          describe("operator dashboard formulas", () => {
            it("ignores zero-length strings when counting possible duplicate references", () => {
              expect(POSSIBLE_DUPLICATE_COUNT_FORMULA).toBe("=SUMPRODUCT(--(LEN(ZAPISY!AB2:AB)>0))");
              expect(POSSIBLE_DUPLICATE_COUNT_FORMULA).not.toContain("COUNTIF");
            });

            it("scopes duplicate and attention counts to the current season", () => {
              expect(buildPossibleDuplicateCountFormula("2026-2027")).toBe(
                '=SUMPRODUCT(--(ZAPISY!V2:V="2026-2027");--(LEN(ZAPISY!AB2:AB)>0))',
              );
              expect(buildPossibleDuplicateCountFormula("2026-2027")).not.toContain("COUNTIF");
              expect(buildAttentionFormula("2026-2027")).toContain('ZAPISY!V2:V;"2026-2027"');
              expect(buildStatusCountFormula("2026-2027", "NEW")).toBe(
                '=COUNTIFS(ZAPISY!V2:V;"2026-2027";ZAPISY!P2:P;"NEW")',
              );
            });

            it("keeps group counts pinned to row 2 and scoped to the current season", () => {
              expect(buildConfirmedGroupCountFormula("2026-2027", 13)).toBe(
                '=COUNTIFS(ZAPISY!V$2:V;"2026-2027";ZAPISY!X$2:X;$A13;ZAPISY!P$2:P;"CONFIRMED")',
              );
            });

            it("does not report zero free places when any populated group has unknown capacity", () => {
              expect(buildFreePlacesSummaryFormula(12)).toBe(
                '=IF(COUNTA(A12:A)=0;"BRAK DANYCH";IF(COUNTIFS(A12:A;"<>";F12:F;"-")+COUNTIFS(A12:A;"<>";F12:F;"")>0;"BRAK DANYCH";SUMIF(A12:A;"<>";H12:H)))',
              );
            });

            it("uses human-readable age labels without date-like ellipses", () => {
              expect(buildAgeLabel(null, null)).toBe("bez limitu");
              expect(buildAgeLabel(18, null)).toBe("18+");
              expect(buildAgeLabel(null, 4)).toBe("do 4");
              expect(buildAgeLabel(4, 6)).toBe("4-6");
            });
          });
          ''')

          layout = Path("tests/unit/operator-dashboard-layout.test.ts")
          layout_text = layout.read_text()
          old_layout = '''      groupHeaderRow: 11,
                groupStartRow: 12,'''
          new_layout = '''      groupHeaderRow: 11,
                groupStartRow: 12,
                dataEndRow: 1000,'''
          if layout_text.count(old_layout) != 1:
              raise SystemExit("Could not update dashboard layout expectation")
          layout.write_text(layout_text.replace(old_layout, new_layout))
      - name: Format and test
        run: |
          pnpm exec prettier --write src/infrastructure/google/operator-sheet.ts tests/unit/operator-dashboard-formulas.test.ts tests/unit/operator-dashboard-layout.test.ts
          pnpm exec vitest run tests/unit/operator-dashboard-formulas.test.ts tests/unit/operator-dashboard-layout.test.ts tests/unit/operator-sheet.test.ts
          pnpm exec tsc --noEmit
      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/operator-sheet-hardening-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/google/operator-sheet.ts tests/unit/operator-dashboard-formulas.test.ts tests/unit/operator-dashboard-layout.test.ts .github/workflows/operator-sheet-hardening-patch.yml
          git commit -m "fix: harden operator sheet dashboard"
          git push origin HEAD:fix/operator-sheet-hardening
