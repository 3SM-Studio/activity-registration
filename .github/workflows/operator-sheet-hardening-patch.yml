name: Apply operator sheet hardening patch

on:
  push:
    branches:
      - fix/operator-sheet-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/operator-sheet-hardening
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply patch
        run: python scripts/operator-sheet-hardening-patch.py
      - name: Format and test
        run: |
          pnpm exec prettier --write src/infrastructure/google/operator-sheet.ts tests/unit/operator-dashboard-formulas.test.ts tests/unit/operator-dashboard-layout.test.ts
          pnpm exec vitest run tests/unit/operator-dashboard-formulas.test.ts tests/unit/operator-dashboard-layout.test.ts tests/unit/operator-sheet.test.ts
          pnpm exec tsc --noEmit
      - name: Commit patch and remove helpers
        run: |
          rm .github/workflows/operator-sheet-hardening-patch.yml scripts/operator-sheet-hardening-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/google/operator-sheet.ts tests/unit/operator-dashboard-formulas.test.ts tests/unit/operator-dashboard-layout.test.ts .github/workflows/operator-sheet-hardening-patch.yml scripts/operator-sheet-hardening-patch.py
          git commit -m "fix: harden operator sheet dashboard"
          git push origin HEAD:fix/operator-sheet-hardening
