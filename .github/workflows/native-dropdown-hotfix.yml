name: Native group dropdown hotfix

on:
  push:
    branches:
      - fix/native-group-dropdown-2026-08-21

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[native-dropdown-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/native-group-dropdown-2026-08-21
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply audited Google Tables fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Operator code uses native Google Table DROPDOWN / ONE_OF_LIST instead of
          # setDataValidation, which Google rejects on typed table columns.
          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              '''  OPERATOR_DASHBOARD_SHEET,\n  REGISTRATION_HEADERS,\n  SETTING_KEY,''',
              '''  OPERATOR_DASHBOARD_SHEET,\n  REGISTRATION_HEADERS,\n  REGISTRATION_TABLE_COLUMNS,\n  SETTING_KEY,''',
          )

          validation_block = '''  requests.push({\n    setDataValidation: {\n      range: {\n        sheetId: sheet.sheetId,\n        startRowIndex: 1,\n        startColumnIndex: GROUP_COLUMN_INDEX,\n        endColumnIndex: GROUP_COLUMN_INDEX + 1,\n      },\n      rule: {\n        condition: {\n          type: "ONE_OF_RANGE",\n          values: [{ userEnteredValue: `${OPERATOR_DASHBOARD_SHEET}!A13:A1000` }],\n        },\n        inputMessage:\n          "Wybierz aktywną grupę bieżącego sezonu. Po przypisaniu sprawdź zgodność wieku i oferty.",\n        strict: true,\n        showCustomUi: true,\n      },\n    },\n  });\n\n'''
          replace_once("src/infrastructure/google/operator-sheet.ts", validation_block, "")

          insertion_point = '''export function buildOperatorSheetRequests(\n  sheet: SheetMetadata,\n): readonly Record<string, unknown>[] {'''
          helper = '''export function buildAssignedGroupTableRequest(activeGroupIds: readonly string[]) {\n  const uniqueGroupIds = [...new Set(activeGroupIds.map((id) => id.trim()).filter(Boolean))];\n  const columnProperties = REGISTRATION_TABLE_COLUMNS.map((column) => {\n    if (column.columnIndex !== GROUP_COLUMN_INDEX || uniqueGroupIds.length === 0) {\n      return column;\n    }\n\n    return {\n      columnIndex: column.columnIndex,\n      columnName: column.columnName,\n      columnType: "DROPDOWN",\n      dataValidationRule: {\n        condition: {\n          type: "ONE_OF_LIST",\n          values: uniqueGroupIds.map((value) => ({ userEnteredValue: value })),\n        },\n      },\n    } as const;\n  });\n\n  return {\n    updateTable: {\n      table: {\n        tableId: REGISTRATIONS_TABLE_ID,\n        columnProperties,\n      },\n      fields: "columnProperties",\n    },\n  } as const;\n}\n\nasync function readDashboardGroupIds(client: SheetsClient): Promise<readonly string[]> {\n  const rows = await client.getValues(`${OPERATOR_DASHBOARD_SHEET}!A13:A1000`);\n  return rows\n    .map((row) => String(row[0] ?? "").trim())\n    .filter((value) => value.length > 0);\n}\n\n'''
          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              insertion_point,
              helper + insertion_point,
          )

          replace_once(
              "src/infrastructure/google/operator-sheet.ts",
              '''export async function bootstrapOperatorSheetExperience(client: SheetsClient): Promise<void> {\n  const dashboard = await ensureDashboardSheet(client);\n  const metadata = await client.getSheetMetadata();\n  await client.batchUpdate(buildOperatorSheetRequests(registrationSheet(metadata)));\n  await bootstrapDashboard(client, dashboard);\n}''',
              '''export async function bootstrapOperatorSheetExperience(client: SheetsClient): Promise<void> {\n  const dashboard = await ensureDashboardSheet(client);\n  await bootstrapDashboard(client, dashboard);\n\n  const activeGroupIds = await readDashboardGroupIds(client);\n  let metadata = await client.getSheetMetadata();\n  await client.batchUpdate([buildAssignedGroupTableRequest(activeGroupIds)]);\n\n  metadata = await client.getSheetMetadata();\n  await client.batchUpdate(buildOperatorSheetRequests(registrationSheet(metadata)));\n}''',
          )

          validate_anchor = '''  if (!metadata.some((candidate) => candidate.title === OPERATOR_DASHBOARD_SHEET)) {\n    throw new Error("PANEL_OPERATORA sheet is missing.");\n  }\n\n'''
          validate_extra = validate_anchor + '''  const activeGroupIds = await readDashboardGroupIds(client);\n  const registrationTable = (sheet.tables ?? []).find(\n    (table) => table.tableId === REGISTRATIONS_TABLE_ID,\n  );\n  const groupColumn = registrationTable?.columnProperties.find(\n    (column) => column.columnIndex === GROUP_COLUMN_INDEX,\n  );\n\n  if (!groupColumn) {\n    throw new Error("ZAPISY ASSIGNED_GROUP_ID table column is missing.");\n  }\n\n  if (activeGroupIds.length === 0) {\n    if (groupColumn.columnType !== "TEXT") {\n      throw new Error("ZAPISY ASSIGNED_GROUP_ID must be TEXT when no active groups exist.");\n    }\n  } else {\n    if (groupColumn.columnType !== "DROPDOWN") {\n      throw new Error("ZAPISY ASSIGNED_GROUP_ID is not a native dropdown.");\n    }\n\n    const expectedValues = new Set(activeGroupIds);\n    const actualValues = new Set(groupColumn.dropdownValues ?? []);\n    if (\n      actualValues.size !== expectedValues.size ||\n      [...expectedValues].some((value) => !actualValues.has(value))\n    ) {\n      throw new Error("ZAPISY ASSIGNED_GROUP_ID dropdown has stale group IDs.");\n    }\n  }\n\n'''
          replace_once("src/infrastructure/google/operator-sheet.ts", validate_anchor, validate_extra)

          # Base sheet validation accepts the group column in either bootstrap TEXT state
          # or final operator DROPDOWN state. Operator validation enforces the final list.
          replace_once(
              "src/infrastructure/google/sheet-admin.ts",
              '''    if (\n      !actual ||\n      actual.columnName !== expected.columnName ||\n      actual.columnType !== expected.columnType\n    ) {''',
              '''    const columnTypeMatches =\n      actual &&\n      (expected.columnName === "ASSIGNED_GROUP_ID"\n        ? actual.columnType === expected.columnType || actual.columnType === "DROPDOWN"\n        : actual.columnType === expected.columnType);\n\n    if (!actual || actual.columnName !== expected.columnName || !columnTypeMatches) {''',
          )

          # Regression tests use the native table dropdown contract and prove the old
          # setDataValidation request is gone.
          replace_once(
              "tests/unit/operator-sheet.test.ts",
              '''  buildOperatorSheetRequests,\n  OWNED_OPERATOR_FORMAT_FORMULAS,''',
              '''  buildAssignedGroupTableRequest,\n  buildOperatorSheetRequests,\n  OWNED_OPERATOR_FORMAT_FORMULAS,''',
          )

          old_test = '''  it("uses the active current-season dashboard list as the group dropdown source", () => {\n    const requests = buildOperatorSheetRequests(sheet());\n    const validation = requests.find((request) => "setDataValidation" in request)\n      ?.setDataValidation as\n      | { rule?: { condition?: { type?: string; values?: Array<{ userEnteredValue?: string }> } } }\n      | undefined;\n\n    expect(validation?.rule?.condition).toEqual({\n      type: "ONE_OF_RANGE",\n      values: [{ userEnteredValue: "PANEL_OPERATORA!A13:A1000" }],\n    });\n  });'''
          new_test = '''  it("uses a native table dropdown for active current-season group IDs", () => {\n    const request = buildAssignedGroupTableRequest(["group-a", "group-b", "group-a"]);\n    const updateTable = request.updateTable;\n    const groupColumn = updateTable.table.columnProperties.find(\n      (column) => column.columnIndex === 23,\n    );\n\n    expect(groupColumn).toEqual({\n      columnIndex: 23,\n      columnName: "ASSIGNED_GROUP_ID",\n      columnType: "DROPDOWN",\n      dataValidationRule: {\n        condition: {\n          type: "ONE_OF_LIST",\n          values: [\n            { userEnteredValue: "group-a" },\n            { userEnteredValue: "group-b" },\n          ],\n        },\n      },\n    });\n    expect(buildOperatorSheetRequests(sheet()).some((item) => "setDataValidation" in item)).toBe(\n      false,\n    );\n  });\n\n  it("keeps the group table column as text when there are no active groups", () => {\n    const request = buildAssignedGroupTableRequest([]);\n    const groupColumn = request.updateTable.table.columnProperties.find(\n      (column) => column.columnIndex === 23,\n    );\n\n    expect(groupColumn).toMatchObject({\n      columnIndex: 23,\n      columnName: "ASSIGNED_GROUP_ID",\n      columnType: "TEXT",\n    });\n  });'''
          replace_once("tests/unit/operator-sheet.test.ts", old_test, new_test)
          PY
      - run: pnpm format
      - run: pnpm test:run tests/unit/operator-sheet.test.ts tests/unit/sheet-admin.test.ts
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/google/operator-sheet.ts src/infrastructure/google/sheet-admin.ts tests/unit/operator-sheet.test.ts
          git commit -m "fix: use native table dropdown for groups [native-dropdown-bot]"
          git push origin HEAD:fix/native-group-dropdown-2026-08-21
