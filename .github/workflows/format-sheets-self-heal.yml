name: Format Sheets self-heal patch

on:
  push:
    branches:
      - fix/sheets-catalog-self-heal

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/sheets-catalog-self-heal
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/refresh-pozytywka-offer-2026-2027.ts src/infrastructure/google/supporting-sheet-tables.ts tests/unit/supporting-sheet-tables.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/refresh-pozytywka-offer-2026-2027.ts src/infrastructure/google/supporting-sheet-tables.ts tests/unit/supporting-sheet-tables.test.ts
          git commit -m "chore: format Sheets self-heal patch"
          git push origin HEAD:fix/sheets-catalog-self-heal
