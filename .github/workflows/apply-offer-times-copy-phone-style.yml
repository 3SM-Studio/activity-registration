name: Apply offer times and UI copy

on:
  push:
    branches:
      - fix/offer-times-copy-phone-style

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/offer-times-copy-phone-style
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply confirmed schedule and UI updates
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {found}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          catalog = "src/config/pozytywka-offer-2026-2027.ts"
          for old, new in [
              ("Poniedziałki od 18:30.", "Poniedziałki 18:30-19:30."),
              ("Poniedziałki od 18:15.", "Poniedziałki 18:15-19:15."),
              ("Wtorki od 16:15.", "Wtorki 16:15-17:15."),
              ("Wtorki od 17:15.", "Wtorki 17:15-18:15."),
              ("Poniedziałki od 17:30.", "Poniedziałki 17:30-18:00."),
              ("Środy od 15:15.", "Środy 15:15-16:15."),
              ("Czwartki od 17:45.", "Czwartki 17:45-18:45."),
              ("Poniedziałki od 18:45.", "Poniedziałki 18:45-19:45."),
          ]:
              replace(catalog, old, new)

          group_updates = {
              'GROUP_ID: "olkusz-zespol-wokalny-2026-2027"': "19:30",
              'GROUP_ID: "olkusz-stepdance-2026-2027"': "19:15",
              'GROUP_ID: "olkusz-acrodance-5-8-2026-2027"': "17:15",
              'GROUP_ID: "olkusz-acrodance-9-plus-2026-2027"': "18:15",
              'GROUP_ID: "olkusz-plasanie-2026-2027"': "18:00",
              'GROUP_ID: "bukowno-inside-5-8-2026-2027"': "16:15",
              'GROUP_ID: "bukowno-inside-9-plus-2026-2027"': "18:45",
              'GROUP_ID: "bukowno-babeczki-2026-2027"': "19:45",
          }
          p = Path(catalog)
          text = p.read_text(encoding="utf-8")
          for marker, end_time in group_updates.items():
              start = text.index(marker)
              next_group = text.find('    {\n      GROUP_ID:', start + len(marker))
              end = len(text) if next_group == -1 else next_group
              block = text[start:end]
              old = 'END_TIME: "",'
              if block.count(old) != 1:
                  raise SystemExit(f"Unexpected END_TIME shape for {marker}")
              text = text[:start] + block.replace(old, f'END_TIME: "{end_time}",', 1) + text[end:]
          p.write_text(text, encoding="utf-8")

          replace(
              "src/app/page.tsx",
              "Wybierz miasto i rodzaj zajęć, a następnie podaj dane uczestnika. Po wysłaniu\n              Pozytywka sprawdzi zgłoszenie i skontaktuje się z Tobą, aby dobrać odpowiednią grupę\n              oraz termin.",
              "Wybierz lokalizację i konkretne zajęcia, a następnie podaj dane uczestnika. Wysłanie\n              formularza jest zgłoszeniem, nie automatyczną rezerwacją miejsca. Pozytywka sprawdzi\n              dostępność i skontaktuje się z Tobą w sprawie potwierdzenia udziału.",
          )

          css = "src/app/globals.css"
          replace(css, "border: 1px solid var(--color-neutral-400);", "border: 1px solid var(--input);")
          replace(css, "border-radius: 1rem;\n  background: #ffffff;\n  box-shadow: 0 1px 0 rgb(41 23 45 / 0.04);", "border-radius: var(--radius-2xl);\n  background: var(--background);\n  box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);")
          replace(css, "box-shadow: 0 0 0 4px var(--brand-ring);", "box-shadow: 0 0 0 3px rgb(163 32 90 / 0.3);")
          replace(css, "border-radius: 0 1rem 1rem 0;", "border-radius: 0 var(--radius-2xl) var(--radius-2xl) 0;")

          doc = "docs/OFFER_CATALOG_2026-2027.md"
          replace(doc, "Date: 2026-08-29", "Date: 2026-08-30")
          for old, new in [
              ("poniedziałki od 18:30", "poniedziałki 18:30-19:30"),
              ("poniedziałki od 18:15", "poniedziałki 18:15-19:15"),
              ("wtorki od 16:15", "wtorki 16:15-17:15"),
              ("wtorki od 17:15", "wtorki 17:15-18:15"),
              ("poniedziałki od 17:30", "poniedziałki 17:30-18:00"),
              ("środy od 15:15", "środy 15:15-16:15"),
              ("czwartki od 17:45", "czwartki 17:45-18:45"),
              ("poniedziałki od 18:45", "poniedziałki 18:45-19:45"),
          ]:
              replace(doc, old, new)
          replace(doc, "- godziny zakończenia tam, gdzie podano tylko godzinę startu,\n", "")
          replace(
              doc,
              "## Brakujące dane pozostawione puste\n\nNie przenosimy wcześniejszych roboczych danych, których nowa oferta nie potwierdza:\n",
              "## Czas trwania zajęć\n\nPo doprecyzowaniu przez Pozytywkę: jeśli w źródłowej ofercie podano tylko godzinę startu, zajęcia trwają 60 minut. Wyjątkiem jest `Pląsanie`, które trwa 30 minut.\n\n## Brakujące dane pozostawione puste\n\nNie przenosimy wcześniejszych roboczych danych, których nowa oferta nie potwierdza:\n",
          )

          test = "tests/unit/pozytywka-offer-2026-2027.test.ts"
          insertion = '''\n  it("uses confirmed durations when the source listed only a start time", () => {\n    const endTimes = Object.fromEntries(\n      groups.map((row) => [String(row.OFFERING_ID), String(row.END_TIME)]),\n    );\n\n    expect(endTimes).toMatchObject({\n      "olkusz-zespol-wokalny": "19:30",\n      "olkusz-stepdance": "19:15",\n      "olkusz-acrodance-5-8": "17:15",\n      "olkusz-acrodance-9-plus": "18:15",\n      "olkusz-plasanie": "18:00",\n      "bukowno-inside-5-8": "16:15",\n      "bukowno-inside-9-plus": "18:45",\n      "bukowno-babeczki": "19:45",\n    });\n  });\n'''
          replace(
              test,
              '  it("keeps Street Dance Squad as one group with both weekly sessions", () => {',
              insertion + '\n  it("keeps Street Dance Squad as one group with both weekly sessions", () => {',
          )
          PY
      - run: pnpm exec prettier --write src/config/pozytywka-offer-2026-2027.ts src/app/page.tsx src/app/globals.css docs/OFFER_CATALOG_2026-2027.md tests/unit/pozytywka-offer-2026-2027.test.ts
      - name: Remove helper workflow and commit result
        run: |
          git rm .github/workflows/apply-offer-times-copy-phone-style.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/pozytywka-offer-2026-2027.ts src/app/page.tsx src/app/globals.css docs/OFFER_CATALOG_2026-2027.md tests/unit/pozytywka-offer-2026-2027.test.ts
          git commit -m "fix: align offer times copy and phone field"
          git push origin HEAD:fix/offer-times-copy-phone-style
