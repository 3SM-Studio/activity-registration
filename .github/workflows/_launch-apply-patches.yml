name: Apply launch copy patches

on:
  push:
    branches:
      - fix/launch-hardening-2026-08-30

permissions:
  contents: write

concurrency:
  group: launch-copy-patches
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/launch-hardening-2026-08-30
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply deterministic copy fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_regex(path: str, pattern: str, replacement: str, already: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if already in text:
                  return
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f"Expected text not found in {path}: {pattern}")
              file.write_text(updated, encoding="utf-8")

          replace_regex(
              "src/components/registration/registration-form.tsx",
              r"Pozytywka sprawdzi dostępne grupy i skontaktuje się z Tobą, żeby ustalić odpowiednią\s+grupę oraz termin\. Samo wysłanie formularza nie oznacza jeszcze potwierdzenia\s+miejsca\.",
              "Pozytywka sprawdzi poprawność zgłoszenia i dostępność miejsca. Po weryfikacji\\n                skontaktujemy się z Tobą, żeby potwierdzić udział lub przekazać dalsze kroki. Samo\\n                wysłanie formularza nie oznacza jeszcze potwierdzenia miejsca.",
              "Pozytywka sprawdzi poprawność zgłoszenia i dostępność miejsca.",
          )
          replace_regex(
              "src/components/registration/registration-form.tsx",
              r"Potwierdzenie otrzymania zgłoszenia wysłaliśmy również na podany adres e-mail\.",
              "Potwierdzenie e-mail powinno dotrzeć na podany adres. Jeśli go nie widzisz, sprawdź folder spam. Nie wysyłaj formularza ponownie tylko z tego powodu.",
              "Potwierdzenie e-mail powinno dotrzeć na podany adres.",
          )
          replace_regex(
              "src/emails/registration-confirmation-email.tsx",
              r"sprawdzimy je i wrócimy z informacją o odpowiedniej grupie oraz terminie\.",
              "sprawdzimy je i wrócimy z potwierdzeniem dostępności oraz dalszymi krokami.",
              "wrócimy z potwierdzeniem dostępności oraz dalszymi krokami.",
          )
          replace_regex(
              "src/emails/registration-confirmation-email.tsx",
              r'title="Dobieramy odpowiednią grupę"\s+description="Bierzemy pod uwagę wybrane zajęcia, miasto i wiek uczestnika\."',
              'title="Sprawdzamy dostępność"\\n          description="Weryfikujemy wybraną ofertę, wiek uczestnika i możliwość przyjęcia zgłoszenia."',
              'title="Sprawdzamy dostępność"',
          )
          replace_regex(
              "src/emails/registration-confirmation-email.tsx",
              r'title="Kontaktujemy się z Tobą"\s+description="Po weryfikacji Pozytywka przekaże informację o dalszych krokach\."',
              'title="Przekazujemy dalsze kroki"\\n          description="Po weryfikacji Pozytywka potwierdzi możliwość udziału albo skontaktuje się w sprawie dalszych kroków."',
              'title="Przekazujemy dalsze kroki"',
          )
      - name: Format changed files
        run: pnpm exec prettier --write src/components/registration/registration-form.tsx src/emails/registration-confirmation-email.tsx
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Copy patches already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/registration/registration-form.tsx src/emails/registration-confirmation-email.tsx
          git commit -m "fix: align post-submit communication with delivery semantics"
          git push origin HEAD:fix/launch-hardening-2026-08-30
