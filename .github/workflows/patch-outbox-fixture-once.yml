name: Patch outbox fixture once

on:
  push:
    branches:
      - feat/durable-notification-outbox

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/durable-notification-outbox
      - name: Update validation fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/sheet-admin.test.ts')
          text = path.read_text()
          needle = '    [`${SHEET.groups}!A:ZZ`, [SHEET_SCHEMA[SHEET.groups]]],\n'
          replacement = needle + '    [`${SHEET.notifications}!A:ZZ`, [SHEET_SCHEMA[SHEET.notifications]]],\n'
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('fixture insertion point not found')
              text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
      - name: Remove one-time workflow and commit patch
        run: |
          git rm .github/workflows/patch-outbox-fixture-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: include notification sheet validation fixture"
          git push origin HEAD:feat/durable-notification-outbox
