name: Format operator dashboard patch

on:
  push:
    branches:
      - fix/operator-dashboard-ux-2026-08-21

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operator-dashboard-ux-2026-08-21
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/infrastructure/google/operator-sheet.ts tests/unit/operator-dashboard-layout.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/google/operator-sheet.ts tests/unit/operator-dashboard-layout.test.ts
          git diff --cached --quiet || git commit -m "style: format operator dashboard patch"
          git push
